<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DocuShield</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sidebar kiri tetap (navy) + kolom utama dengan topbar. Di bawah 900px sidebar menjadi drawer. */
:root{
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#F8FAFC; --line:#E4E7EB; --line-strong:#BCCCDC;
  --fg:#102A43; --muted:#52606D; --faint:#7B8794;
  --navy:#102A43; --navy-line:rgba(255,255,255,.12); --navy-text:#D9E2EC; --navy-mute:#BCCCDC;
  --blue:#2563EB; --blue-hover:#1D4ED8; --blue-text:#1D4ED8; --blue-tint:#DBEAFE; --blue-soft:#EFF6FF; --blue-ink:#1E40AF; --blue-ring:#BFDBFE;
  --green:#16A34A; --green-deep:#15803D; --green-tint:#DCFCE7; --green-ink:#166534;
  --amber:#F59E0B; --amber-tint:#FEF3C7; --amber-ink:#92400E; --amber-soft:#FFFBEB; --amber-line:#FCD34D; --amber-text:#78350F;
  --red:#DC2626; --red-deep:#B91C1C; --red-tint:#FEE2E2; --red-ink:#991B1B; --red-soft:#FEF2F2; --red-line:#FCA5A5;
  --row-pink:#FEF2F2; --row-amber:#FFF4E5;
  --shadow:0 1px 2px rgba(16,42,67,.06); --shadow-pop:0 12px 32px rgba(16,42,67,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1623; --surface:#12263A; --surface-2:#0F2033; --line:#26405A; --line-strong:#3A5775;
  --fg:#E6EDF5; --muted:#9FB3C8; --faint:#7F95AB;
  --navy:#0A1827; --navy-line:rgba(255,255,255,.10);
  --blue-hover:#3B76F0; --blue-text:#8DB8FF; --blue-tint:#16346A; --blue-soft:#12274A; --blue-ink:#C3DAFF; --blue-ring:#27498A;
  --green-deep:#4ADE80; --green-tint:#10412A; --green-ink:#9AF0BC;
  --amber-tint:#4A3410; --amber-ink:#FCD34D; --amber-soft:#2E2410; --amber-line:#7A5A16; --amber-text:#FBD98A;
  --red-deep:#FF8A8A; --red-tint:#4D1B1F; --red-ink:#FFB4B4; --red-soft:#35171B; --red-line:#7C2A2F;
  --row-pink:#3A1A1F; --row-amber:#3A2B14;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-pop:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1623; --surface:#12263A; --surface-2:#0F2033; --line:#26405A; --line-strong:#3A5775;
  --fg:#E6EDF5; --muted:#9FB3C8; --faint:#7F95AB;
  --navy:#0A1827; --navy-line:rgba(255,255,255,.10);
  --blue-hover:#3B76F0; --blue-text:#8DB8FF; --blue-tint:#16346A; --blue-soft:#12274A; --blue-ink:#C3DAFF; --blue-ring:#27498A;
  --green-deep:#4ADE80; --green-tint:#10412A; --green-ink:#9AF0BC;
  --amber-tint:#4A3410; --amber-ink:#FCD34D; --amber-soft:#2E2410; --amber-line:#7A5A16; --amber-text:#FBD98A;
  --red-deep:#FF8A8A; --red-tint:#4D1B1F; --red-ink:#FFB4B4; --red-soft:#35171B; --red-line:#7C2A2F;
  --row-pink:#3A1A1F; --row-amber:#3A2B14;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-pop:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
h1,h2,h3,p,dl,dd,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
a{color:var(--blue-text);text-decoration:none}
button{font-family:inherit}
svg{flex:0 0 auto}
:focus-visible{outline:3px solid var(--blue-ring);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{font-size:28px;line-height:1.25;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h1:focus{outline:none}
h2{font-size:18px;font-weight:800}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--navy);color:#fff;display:flex;flex-direction:column;gap:28px;overflow-y:auto;
  padding:24px 20px 24px max(20px,env(safe-area-inset-left,0px))}
.brand{display:flex;flex-direction:column;gap:10px}
.brand-row{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff}
.brand-name{font-size:21px;font-weight:800;letter-spacing:-.01em}
.tagline{font-size:12px;line-height:1.5;color:var(--navy-mute)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:10px;color:var(--navy-text);font-size:15px;font-weight:600}
.nav a:hover{background:rgba(255,255,255,.10)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.helpcard{margin-top:auto;background:rgba(255,255,255,.08);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.helpcard strong{font-size:15px;font-weight:800}
.helpcard .t{font-size:13px;color:var(--navy-text)}
.helpcard .n{font-size:14px;font-weight:700;letter-spacing:.02em}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{min-height:72px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  padding:0 max(32px,env(safe-area-inset-right,0px)) 0 32px}
.crumb{font-size:14px;font-weight:600;color:var(--muted)}
.crumb b{color:var(--fg);font-weight:600}
.spacer{flex:1}
.iconbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
.dot{position:absolute;top:6px;right:6px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}
.user{display:flex;align-items:center;gap:10px;padding-left:8px;border-left:1px solid var(--line);margin-left:4px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;border:1px solid var(--navy-line)}
.user-t{display:flex;flex-direction:column;line-height:1.3}
.user-t b{font-size:14px}
.user-t span{font-size:12px;color:var(--muted)}
.menubtn{display:none}
.pop{position:absolute;right:0;top:52px;z-index:40;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop);padding:8px}
.pop-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 10px}
.pop-h b{font-size:15px;font-weight:800}
.link{background:none;border:0;padding:8px;min-height:36px;border-radius:8px;color:var(--blue-text);font-size:13px;font-weight:700;cursor:pointer}
.link:hover{background:var(--surface-2)}
.nitem{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px;cursor:pointer;color:inherit}
.nitem:hover{background:var(--surface-2)}
.nitem .u{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--blue)}
.nitem.read .u{background:transparent;border:1px solid var(--line-strong)}
.nitem b{display:block;font-size:14px;font-weight:700}
.nitem span{display:block;font-size:13px;color:var(--muted);line-height:1.5}
.pop-f{border-top:1px solid var(--line);margin-top:6px;padding:10px 10px 6px;font-size:12px;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(5,15,25,.55);z-index:49}

.content{width:100%;max-width:1240px;display:flex;flex-direction:column;gap:24px;padding-block:32px 40px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.page-head p{margin-top:4px;color:var(--muted);max-width:68ch}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;border:1px solid transparent;font-size:15px;font-weight:700;cursor:pointer;text-align:center;line-height:1.3}
.btn-lg{min-height:52px;padding:0 28px;font-size:16px}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 1px 2px rgba(16,42,67,.2)}
.btn-primary:hover{background:var(--blue-hover)}
.btn-outline{background:var(--surface);border-color:var(--blue);color:var(--blue-text)}
.btn-outline:hover{background:var(--blue-soft)}
.btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--fg)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--surface);border-color:var(--line-strong);color:var(--red-deep)}
.btn-danger:hover{background:var(--red-soft)}
.btn[disabled]{opacity:.7;cursor:progress}
.btn-block{width:100%}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Cards, badges */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card-pad{padding:24px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor;display:block}
.b-ok{background:var(--green-tint);color:var(--green-ink)}
.b-warn{background:var(--amber-tint);color:var(--amber-ink)}
.b-bad{background:var(--red-tint);color:var(--red-ink)}
.b-info{background:var(--blue-tint);color:var(--blue-ink)}
.b-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.notice{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.55}
.n-info{background:var(--blue-soft);border:1px solid var(--blue-ring);color:var(--blue-ink)}
.n-warn{background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber-text);font-weight:500}
.n-err{background:var(--red-soft);border:1px solid var(--red-line);color:var(--red-ink)}
.n-ok{background:var(--green-tint);border:1px solid var(--green);color:var(--green-ink)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:20px}
.stat{padding:20px;display:flex;flex-direction:column;gap:14px}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.sico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.tag{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line-strong);border-radius:999px;padding:3px 8px}
.stat-l{font-size:14px;font-weight:600;color:var(--muted)}
.stat-n{font-size:36px;line-height:1.15;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>div{height:100%}
.stat-f{font-size:13px;color:var(--muted)}

/* Table */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1 1 220px;min-width:0;max-width:340px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.field{width:100%;min-height:46px;padding:0 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--fg);font-family:var(--font);font-size:15px}
.field::placeholder{color:var(--faint)}
.field:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-ring)}
.field[aria-invalid="true"]{border-color:var(--red)}
textarea.field{padding:12px 14px;line-height:1.5;resize:vertical;min-height:84px}
select.field{padding-right:10px}
.search .field{padding-left:38px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-size:13px;font-weight:700;cursor:pointer}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;padding:12px 16px;background:var(--surface-2);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{padding-left:24px}
.tbl th:last-child,.tbl td:last-child{padding-right:24px;text-align:right}
.tbl td{padding:14px 16px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .id{font-weight:800;color:var(--fg)}
.tbl .c{text-align:center}
.sortbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer}
.tfoot{padding:14px 24px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.empty{padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted)}
.empty b{color:var(--fg);font-size:16px}

/* Upload */
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col-main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:24px}
.col-side{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:24px}
.stack{display:flex;flex-direction:column;gap:16px}
.drop{border:2px dashed var(--line-strong);background:var(--surface-2);border-radius:14px;padding:32px 24px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop.has{border-color:var(--green);border-style:solid;background:var(--green-tint)}
.drop.err{border-color:var(--red);background:var(--red-soft)}
.drop:focus-within{outline:3px solid var(--blue-ring);outline-offset:2px}
.drop-t{font-size:17px;font-weight:800}
.filerow{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;width:100%}
.filemeta{display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.filemeta b{font-size:16px;font-weight:800;overflow-wrap:anywhere}
.filemeta .ok{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--green-ink)}
.pdf-ico .p1{fill:var(--blue-soft);stroke:var(--blue-text)}
.pdf-ico .p2{fill:var(--blue)}
.fine{font-size:13px;line-height:1.6;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:18px}
.fg{display:flex;flex-direction:column;gap:6px;min-width:0}
.fg label,.fg .lbl{font-size:14px;font-weight:700}
.fg .opt{font-weight:500;color:var(--muted)}
.ferr{font-size:13px;font-weight:600;color:var(--red-deep)}
.check{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;min-height:44px}
.check:hover{background:var(--surface-2)}
.check input{width:22px;height:22px;margin:0;flex:0 0 auto;accent-color:var(--blue);cursor:pointer}
.check b{display:block;font-size:15px;font-weight:700}
.check span{display:block;font-size:13px;color:var(--muted);line-height:1.5}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* Processing */
.hero-proc{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.hero-proc p{max-width:62ch;line-height:1.7;color:var(--muted)}
.ring{position:relative;width:112px;height:112px;display:flex;align-items:center;justify-content:center}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:4px solid var(--blue-tint);border-top-color:var(--blue);animation:spin 1.1s linear infinite}
.ring.still::before{animation:none;border-color:var(--green)}
.doc-art .a1{fill:var(--surface-2);stroke:var(--line-strong)}
.doc-art .a2{stroke:var(--line-strong)}
.doc-art .a3{fill:var(--navy)}
.steps{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.step{display:flex;align-items:center;gap:14px;padding:16px 20px}
.step+.step{border-top:1px solid var(--line)}
.step.active{background:var(--blue-soft)}
.step b{flex:1;font-size:15px;font-weight:700}
.step.wait b,.step.skip b{color:var(--muted);font-weight:600}
.sdot{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.sdot.done{background:var(--green);color:#fff}
.sdot.ring-s::before{content:"";width:26px;height:26px;border-radius:50%;border:3px solid var(--blue-ring);border-top-color:var(--blue);animation:spin 1.1s linear infinite}
.sdot.wait::before,.sdot.skip::before{content:"";width:26px;height:26px;border-radius:50%;border:3px solid var(--line-strong)}
.sdot.skip::before{border-style:dashed}
.prog{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.prog>div{height:100%;background:var(--blue);transition:width .4s}
.dl{display:flex;flex-direction:column;gap:16px}
.dl dt{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.dl dd{font-size:15px;font-weight:700;overflow-wrap:anywhere}

/* Report */
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:20px}
.meta dt{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.meta dd{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:20px 28px;border-top:1px solid var(--line);padding-top:24px}
.big{display:inline-flex;align-items:center;gap:12px;min-height:60px;padding:8px 26px;border-radius:14px;color:#fff;font-size:20px;font-weight:800;line-height:1.3}
.big.red{background:var(--red)}
.big.green{background:var(--green)}
.counts{display:flex;flex-wrap:wrap;gap:28px}
.counts div{display:flex;flex-direction:column;gap:2px}
.counts b{font-size:28px;line-height:1.2;font-weight:800;font-variant-numeric:tabular-nums}
.counts span{font-size:13px;font-weight:600;color:var(--muted)}
.rtable{min-width:980px}
.rrow{display:grid;grid-template-columns:1.1fr 1.5fr 1.4fr .8fr 2.4fr;gap:16px;padding:18px 24px;border-top:1px solid var(--line);align-items:start;font-size:14px;line-height:1.6}
.rrow.h{background:var(--surface-2);border-top:0;padding-block:12px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.rrow.pink{background:var(--row-pink)}
.rrow.amber{background:var(--row-amber)}
.rrow.skip{background:var(--surface-2)}
.rrow .p{font-weight:800;line-height:1.5}
.rrow .r{display:flex;flex-direction:column;gap:4px}
.rrow .r b{font-weight:800;line-height:1.5}
.rrow .r small{font-size:13px;font-weight:600;color:var(--muted)}
.rrow .r.bad b{color:var(--red-deep)}
.rrow .r.good b{color:var(--green-deep)}

function acceptFile(f){
  if(!f)return;
  const okType=f.type==='application/pdf'||/\.pdf$/i.test(f.name);
  if(!okType){draft.file=null;renderDrop('err');setDropErr('Format file tidak didukung. Pilih dokumen dengan format PDF.');return;}
  if(f.size>10*1048576){draft.file=null;renderDrop('err');setDropErr('Ukuran file '+fmtSize(f.size)+' melebihi batas 10 MB. Pilih file yang lebih kecil.');return;}
  if(f.size===0){draft.file=null;renderDrop('err');setDropErr('File kosong. Pilih dokumen PDF yang berisi data.');return;}
  draft.file={name:f.name,size:f.size,demo:false};setDropErr('');renderDrop();clearSummary();toast('File dipilih: '+f.name);
}

  const kt=v.kontak.trim();
  if(kt){const phone=kt.replace(/[\s-]/g,'');if(!(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(kt)||/^(\+?62|0)8[0-9]{8,12}$/.test(phone))){setFieldErr('kontak','Isi nomor WhatsApp (contoh 0822...) atau alamat email yang benar.');add('kontak','Kontak tidak valid.','f-kontak');}}
  const any=CHECKS.some(function(c){return draft.checks[c.k];});

  if(errs.length){
    $('#errSum').innerHTML='<div class="notice n-err" role="alert" style="margin-bottom:24px">'+ico('alertc')+'<div><b>Periksa kembali isian Anda ('+errs.length+' masalah)</b><ul style="margin:6px 0 0;padding-left:18px;list-style:disc;font-weight:500">'+errs.map(function(x){return '<li>'+esc(x.msg)+'</li>';}).join('')+'</ul></div></div>';
    const t=document.getElementById(errs[0].focus);if(t){try{t.scrollIntoView({block:'center',behavior:reduceMotion?'auto':'smooth'});}catch(e){}if(t.id!=='drop')t.focus({preventScroll:true});}

  }

  const btn=$('#submitBtn');btn.disabled=true;btn.innerHTML='<span class="spin" style="display:inline-flex">'+ico('loader')+'</span> Mengirim (simulasi)…';
  setTimeout(function(){

    mem.subs.push(sub);mem.seq+=1;

    save();draft=freshDraft();updateNotifDot();

  },900);
}

/* ---------- Processing ---------- */
const STEPS=[{k:'recv',label:'Dokumen diterima'},{k:'hs',label:'Pemeriksaan HS Code'},{k:'price',label:'Pemeriksaan kewajaran harga'},{k:'lartas',label:'Pemeriksaan Lartas'},{k:'report',label:'Penyusunan laporan'}];
const STEP_MS=4000;
function stepStates(sub){
  const enabled=STEPS.filter(function(s){return s.k==='recv'||s.k==='report'||sub.checks[s.k]!==false;});
  const work=enabled.filter(function(s){return s.k!=='recv';});
  let res={},complete=false,done=1;
  if(sub.seeded){
    STEPS.forEach(function(s){res[s.k]=s.k==='recv'?'done':(s.k==='hs'?'active':'wait');});
    return {res:res,complete:false,pct:20,live:false};
  }
  const el=Date.now()-new Date(sub.at).getTime();
  const idx=Math.floor(el/STEP_MS);
  STEPS.forEach(function(s){
    if(s.k==='recv'){res[s.k]='done';return;}
    if(enabled.indexOf(s)<0){res[s.k]='skip';return;}
    const j=work.indexOf(s);
    if(idx>j){res[s.k]='done';done++;}else if(idx===j){res[s.k]='active';}else res[s.k]='wait';
  });
  complete=idx>=work.length;
  return {res:res,complete:complete,pct:Math.round(done/enabled.length*100),live:!complete};
}

function buildReport(sub){
  const base=sub.seeded?REPORTS[sub.sample]:REPORTS['10294'];
  const f=sub.form||{};
  const rows=base.rows.map(function(r){
    const o=Object.assign({},r);
    if(!sub.seeded){
      if(sub.checks[r.k]===false){o.tone='skip';o.result='Tidak dipilih untuk diperiksa';o.sub='';o.text='Jenis pemeriksaan ini tidak dipilih saat pengajuan.';o.data='—';return o;}

      if(r.k==='hs')o.data='Deskripsi: '+(f.barang||'belum diisi')+'. HS Code: '+(f.hs||'tidak diisi')+'.';
      if(r.k==='inv')o.data='File: '+sub.file+'.';
      if(r.k==='lartas')o.data='Negara asal: '+(NEGARA[f.negara]||'belum dipilih')+'. Barang: '+(f.barang||'belum diisi')+'.';
    }
    return o;
  });
  const flags=rows.filter(function(r){return r.tone==='pink'||r.tone==='amber';}).length;
  const oks=rows.filter(function(r){return r.tone==='ok';}).length;
  let recs;
  if(base.recsText&&sub.seeded)recs=base.recsText.slice();
  else recs=(base.recs||[]).filter(function(k){return rows.some(function(r){return r.k===k&&r.tone!=='skip';});}).map(function(k){return RECS[k];});
  return {rpt:sub.rpt,shp:sub.id,file:sub.file,date:fmtDT(sub.at),status:base.status,note:base.note,sample:base.sample,rows:rows,flags:flags,oks:oks,total:rows.length,recs:recs};
}

  clearfile:function(){draft.file=null;renderDrop();setDropErr('');toast('File dihapus');},
  togglechecks:function(){const all=CHECKS.every(function(c){return draft.checks[c.k];});CHECKS.forEach(function(c){draft.checks[c.k]=!all;});syncChecks();const e=$('#e-checks');if(e)e.hidden=true;},
  rf:function(el){rf=el.getAttribute('data-v');$$('.chip[data-act="rf"]').forEach(function(c){c.setAttribute('aria-pressed',String(c===el));});$('#rrows').innerHTML=reportRowsHtml(curReport);},
  rfall:function(){rf='all';$$('.chip[data-act="rf"]').forEach(function(c){c.setAttribute('aria-pressed',String(c.getAttribute('data-v')==='all'));});$('#rrows').innerHTML=reportRowsHtml(curReport);},
  copyrpt:function(){const t=curReport.rpt;const ok=function(){toast('Nomor laporan '+t+' disalin');};const fb=function(){toast('Nomor laporan: '+t+' (salin manual)');};try{navigator.clipboard.writeText(t).then(ok,fb);}catch(e){fb();}},
  pdf:async function(el){
    if(!dl||!window.jspdf)return;el.disabled=true;
    try{const buf=await makePdf(curReport);const r=await dl.save({filename:'Laporan_'+curReport.rpt+'.pdf',data:buf});toast(r&&r.status==='saved'?'Laporan PDF disimpan':'Laporan PDF dikirim');}
    catch(e){toast(e&&e.code==='declined'?'Unduhan dibatalkan':'Laporan PDF tidak dapat disimpan di tampilan ini');}
    el.disabled=false;
  },
  readall:function(){notifList().forEach(function(n){mem.read[n.id]=true;});save();updateNotifDot();renderNotif();},
  notif:function(el){mem.read[el.getAttribute('data-id')]=true;save();updateNotifDot();const r=el.getAttribute('data-route');closeNotif();go(r);}
};
document.addEventListener('click',function(e){
  const a=e.target.closest('[data-act]');
  if(a&&acts[a.getAttribute('data-act')]){e.preventDefault();acts[a.getAttribute('data-act')](a);return;}
  const g=e.target.closest('a[data-go]');
  if(g){if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1)return;e.preventDefault();go(g.getAttribute('data-go'));return;}
  const tr=e.target.closest('tr[data-row]');
  if(tr&&!e.target.closest('a,button')){go(tr.getAttribute('data-row'));return;}
  const rec=e.target.closest('input[data-rec]');
  if(rec&&curReport){const arr=mem.rec[curReport.rpt]||(mem.rec[curReport.rpt]=[]);arr[Number(rec.getAttribute('data-rec'))]=rec.checked;save();rec.closest('.rec').classList.toggle('done',rec.checked);$('#recProg').textContent=recProgress(curReport);return;}
  if(!e.target.closest('#notifPanel')&&!e.target.closest('#notifBtn'))closeNotif();
});
$('#notifBtn').addEventListener('click',function(){if($('#notifPanel').hidden)openNotif();else closeNotif();});
$('#menuBtn').addEventListener('click',function(){if($('#side').classList.contains('open'))closeDrawer();else openDrawer();});
$('#scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('#notifPanel').hidden){closeNotif();$('#notifBtn').focus();}else if($('#side').classList.contains('open')){closeDrawer();$('#menuBtn').focus();}}});
$$('.nav a[data-go]').forEach(function(a){a.addEventListener('click',closeDrawer);});

hydrateIcons(document.getElementById('app'));
updateNotifDot();
render();
})();
</script>

</body></html>
